# Copy to dobukasu.toml (or point DOBUKASU_CONFIG at it) and edit.
# Every key below shows its built-in default unless noted.

[server]
# Where the HTTP API listens.
bind = "127.0.0.1:8080"

[search]
# Default number of merged results.
limit = 10
# Upper bound a client may request with ?limit=.
max_limit = 50
# Per-engine deadline in milliseconds.
timeout_ms = 8000
# Merge the same page across engines.
dedup = true
# Sent to every upstream. Override when an engine starts rejecting the default.
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
# Restrict the engines used when a request omits ?engines=.
# engines = ["bing", "duckduckgo"]

# Every bundled engine is enabled by default. `enabled = false` removes it
# from /search and from /engines.
[engines.bing]
enabled = true

[engines.duckduckgo]
enabled = true

[engines.google]
enabled = true
# auto: use the Custom Search API when api_key and cx exist, HTML otherwise.
# html: always scrape the results page (Google often blocks this).
# cse:  always use the Custom Search JSON API.
mode = "auto"
# api_key = "..."
# cx = "..."

# Environment variables override the file:
#   DOBUKASU_BIND, DOBUKASU_LIMIT, DOBUKASU_MAX_LIMIT, DOBUKASU_TIMEOUT_MS,
#   DOBUKASU_DEDUP, DOBUKASU_USER_AGENT, DOBUKASU_ENGINES, DOBUKASU_CONFIG
# GOOGLE_API_KEY and GOOGLE_CX are read by the google plug-in itself.
