[package]
name = "dobukasu-engine-duckduckgo"
description = "DuckDuckGo search engine plug-in for dobukasu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
dobukasu-core = { version = "0.1.0", path = "../core" }
inventory = "0.3.25"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli"] }
scraper = "0.29.0"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
