[package]
name = "dobukasu"
description = "Minimal plug-in based meta-search for agents, as a CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "dobukasu"
path = "src/main.rs"

[dependencies]
dobukasu-core = { version = "0.1.0", path = "../core" }
dobukasu-engine-bing = { version = "0.1.0", path = "../engine-bing" }
dobukasu-engine-brave = { version = "0.1.0", path = "../engine-brave" }
dobukasu-engine-duckduckgo = { version = "0.1.0", path = "../engine-duckduckgo" }
dobukasu-engine-google = { version = "0.1.0", path = "../engine-google" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
async-trait = "0.1.92"
serde_json = "1.0.154"
