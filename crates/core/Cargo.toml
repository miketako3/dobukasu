[package]
name = "dobukasu-core"
description = "Core types, plug-in registry, rank fusion and engine plumbing for dobukasu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
inventory = "0.3.25"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
