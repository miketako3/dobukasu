[package]
name = "dobukasu"
description = "Minimal plug-in based meta-search API for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["json", "query"] }
dobukasu-core = { version = "0.1.0", path = "../core" }
dobukasu-engine-bing = { version = "0.1.0", path = "../engine-bing" }
dobukasu-engine-duckduckgo = { version = "0.1.0", path = "../engine-duckduckgo" }
dobukasu-engine-google = { version = "0.1.0", path = "../engine-google" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
