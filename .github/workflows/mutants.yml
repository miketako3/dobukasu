name: Mutants

# Mutation testing is the quality gate for the test suite: a surviving mutant
# means an observable behaviour is not actually pinned by a test.
# Run manually or weekly; it is too slow for every pull request.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutate
        run: cargo mutants --workspace --timeout 120 --jobs 2 --no-shuffle
