[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine-bing",
    "crates/engine-duckduckgo",
    "crates/engine-google",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/miketako3/dobukasu"
homepage = "https://github.com/miketako3/dobukasu"
authors = ["miketako3"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
